name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["website/**", "**.md"]
  pull_request:
    paths-ignore: ["website/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APKs
        run: ./gradlew :WallPanelApp:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: wallpanel-reborn-debug-apks
          path: WallPanelApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    # Tag a commit with vX.Y.Z to publish a GitHub Release with the APKs attached.
    # The APKs are debug-signed until release signing is set up.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wallpanel-reborn-debug-apks
          path: apks

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" apks/*.apk
          --repo "$GITHUB_REPOSITORY"
          --title "WallPanel Reborn $GITHUB_REF_NAME"
          --generate-notes
          --prerelease
