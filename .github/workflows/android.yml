name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["website/**", "**.md"]
  pull_request:
    paths-ignore: ["website/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APKs
        run: ./gradlew :WallPanelApp:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: wallpanel-reborn-debug-apks
          path: WallPanelApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    # Push a tag like v2026.10.21 to build release APKs signed with the key in the
    # repository secrets and publish them as a GitHub prerelease.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WPR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::WPR_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Build signed release APKs
        env:
          WPR_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          WPR_KEYSTORE_PASSWORD: ${{ secrets.WPR_KEYSTORE_PASSWORD }}
          WPR_KEY_ALIAS: ${{ secrets.WPR_KEY_ALIAS }}
          WPR_KEY_PASSWORD: ${{ secrets.WPR_KEY_PASSWORD }}
        run: ./gradlew :WallPanelApp:assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"

      - name: Verify signatures and rename
        run: |
          mkdir apks
          for f in WallPanelApp/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$f"
            abi=$(basename "$f" -release.apk); abi=${abi#WallPanelApp-}
            cp "$f" "apks/WallPanelReborn-$GITHUB_REF_NAME-$abi.apk"
          done
          (cd apks && sha256sum *.apk > SHA256SUMS.txt)
          ls -l apks

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" apks/*
          --repo "$GITHUB_REPOSITORY"
          --title "WallPanel Reborn $GITHUB_REF_NAME"
          --generate-notes
          --prerelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
